[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "pixelforge"
version = "2.1.0"
description = "A picture editor with a Pillow-rendered glass interface (Qt shell), built on Pillow and NumPy"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pillow>=10.1",
    "numpy>=1.24",
    "pyside6-essentials>=6.5",
]

[project.scripts]
pixelforge = "pixelforge.gui:main"
pixelforge-cli = "pixelforge.cli:main"

[dependency-groups]
build = [
    "pyinstaller>=6.22.3",
]
dev = [
    "hypothesis>=6.168.5",
    "mypy>=2.4.0",
    "pre-commit>=4.6.2",
    "pytest>=7",
    "pytest-cov",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["pixelforge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["gui: tests that exercise the Qt interface (offscreen)"]

[tool.coverage.run]
source = ["pixelforge"]

[tool.ruff]
line-length = 140
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.mypy]
python_version = "3.10"
files = ["pixelforge", "tests"]
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = true
disallow_incomplete_defs = true
